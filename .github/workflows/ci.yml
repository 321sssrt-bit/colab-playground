name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The Linux and Windows job names below are the status checks the `main` ruleset requires
# (docs/RELEASING.md). Renaming one of them or changing the matrix means updating the ruleset
# too, or no pull request can be merged. The macOS job is not required: a runner is often never
# assigned to it.
jobs:
  # A pull request that changes only docs has nothing to build or test. The jobs below still run
  # for it, because the ruleset waits for their names, but skip every step. Only a clear "docs
  # only" answer skips: a push to `main` or a failed lookup builds and tests everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FILES: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        # A renamed file counts under both names. `grep -c` reads the whole list, where `-q`
        # could end the pipe early and fail it.
        run: |
          files=$(gh api "$PR_FILES" --paginate --jq '.[] | .filename, (.previous_filename // empty)') || exit 0
          [ -n "$files" ] || exit 0
          other=$(printf '%s\n' "$files" | grep -cvE '(\.md$|^docs/)' || true)
          if [ "$other" = 0 ]; then echo "code=false" >> "$GITHUB_OUTPUT"; fi

  web-frontend:
    name: Web Frontend (check, build)
    needs: changes
    # Runs on code PRs, pushes to `main`, or if `changes` failed.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: crates/web/frontend/pnpm-lock.yaml
      - run: pnpm --dir crates/web/frontend install --frozen-lockfile
      - run: pnpm --dir crates/web/frontend run check
      - run: pnpm --dir crates/web/frontend run build
      - name: Verify frontend build outputs
        run: |
          test -f crates/web/frontend/dist/index.html
          test -f crates/web/frontend/.generated/i18n-keys.json
      - uses: actions/upload-artifact@v4
        with:
          name: web-frontend-dist
          path: |
            crates/web/frontend/dist/
            crates/web/frontend/.generated/i18n-keys.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Linux (fmt, clippy, test)
    needs: [changes, web-frontend]
    # Runs even when `changes` or `web-frontend` failed so the required check never skips green.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require web-frontend build
        if: needs.changes.outputs.code != 'false' && needs.web-frontend.result != 'success'
        run: |
          echo "web-frontend job did not succeed (result: ${{ needs.web-frontend.result }})" >&2
          exit 1
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code != 'false'
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.code != 'false'
        with:
          name: web-frontend-dist
          path: crates/web/frontend
      - name: Verify restored frontend artifacts
        if: needs.changes.outputs.code != 'false'
        run: |
          test -f crates/web/frontend/dist/index.html
          test -f crates/web/frontend/.generated/i18n-keys.json
      - uses: dtolnay/rust-toolchain@v1
        if: needs.changes.outputs.code != 'false'
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      # Pull requests restore main's cache and save none of their own: each saved copy is large,
      # and the repository's cache quota would evict main's copies.
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code != 'false'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # gpui's Wayland and X11 backends link xkbcommon and fontconfig (same list as Ely's CI).
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libfontconfig-dev
        if: needs.changes.outputs.code != 'false'
      - run: cargo fmt --all -- --check
        if: needs.changes.outputs.code != 'false'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: needs.changes.outputs.code != 'false'
      - run: cargo test --workspace --locked
        if: needs.changes.outputs.code != 'false'

  web:
    name: Headless Linux (Web fmt, clippy, test)
    needs: [changes, web-frontend]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container: rust:1.98-slim-bookworm
    timeout-minutes: 45
    steps:
      - name: Require web-frontend build
        if: needs.changes.outputs.code != 'false' && needs.web-frontend.result != 'success'
        run: |
          echo "web-frontend job did not succeed (result: ${{ needs.web-frontend.result }})" >&2
          exit 1
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code != 'false'
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.code != 'false'
        with:
          name: web-frontend-dist
          path: crates/web/frontend
      - name: Verify restored frontend artifacts
        if: needs.changes.outputs.code != 'false'
        run: |
          test -f crates/web/frontend/dist/index.html
          test -f crates/web/frontend/.generated/i18n-keys.json
      - run: rustup component add rustfmt clippy
        if: needs.changes.outputs.code != 'false'
      - run: cargo fmt -p colab-playground-web -- --check
        if: needs.changes.outputs.code != 'false'
      - run: cargo clippy -p colab-playground-web --all-targets --locked -- -D warnings
        if: needs.changes.outputs.code != 'false'
      - run: cargo test -p colab-playground-web --locked
        if: needs.changes.outputs.code != 'false'

  check:
    name: ${{ matrix.os }} (check, tests)
    needs: changes
    if: ${{ !cancelled() }} # as in the linux job
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code != 'false'
      - uses: dtolnay/rust-toolchain@v1
        if: needs.changes.outputs.code != 'false'
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code != 'false'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }} # as in the linux job
      # No `cargo check` first: the two test steps compile every target of both crates, and a
      # check would compile them a second time.
      - run: cargo test -p colab-playground-core --locked
        if: needs.changes.outputs.code != 'false'
      # The app's headless UI tests: the title strip, fonts and paths differ per OS.
      - run: cargo test -p colab-playground --locked
        if: needs.changes.outputs.code != 'false'
